<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Student Tools - free calculators and utilities for engineering and university students.">
<title>Student Tools</title>
<style>
:root {
  --navy: #0f172a;
  --text: #1e293b;
  --muted: #64748b;
  --line: #e2e8f0;
  --bg: #f8fafc;
  --white: #ffffff;
  --blue: #2563eb;
  --blue-dark: #1d4ed8;
  --blue-soft: #eff6ff;
  --green-soft: #dcfce7;
  --green: #166534;
  --amber-soft: #fef3c7;
  --amber: #92400e;
  --radius: 14px;
  --shadow: 0 1px 3px rgba(15, 23, 42, .06), 0 4px 14px rgba(15, 23, 42, .06);
  --header-h: 64px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  overflow-x: hidden;
}
button, input { font-family: inherit; }
svg { display: block; flex-shrink: 0; }
:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }

/* ---------- Header ---------- */
.header {
  position: sticky; top: 0; z-index: 30;
  height: var(--header-h);
  display: flex; align-items: center; gap: 14px;
  padding: 0 20px;
  background: var(--white);
  border-bottom: 1px solid var(--line);
}
.menu-btn {
  display: none;
  width: 40px; height: 40px;
  align-items: center; justify-content: center;
  background: none; border: 1px solid var(--line); border-radius: 10px;
  color: var(--navy); cursor: pointer;
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 800; font-size: 18px; color: var(--navy);
  text-decoration: none; white-space: nowrap;
}
.brand-logo {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  color: #fff; display: flex; align-items: center; justify-content: center;
}
.search { position: relative; flex: 1; max-width: 460px; margin: 0 auto 0 24px; }
.search svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
.search input {
  width: 100%; height: 42px;
  padding: 0 14px 0 40px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); font-size: 15px; color: var(--text);
}
.search input:focus { background: #fff; border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px #bfdbfe; }
.crumb { font-size: 14px; color: var(--muted); white-space: nowrap; }
.crumb strong { color: var(--navy); }
.avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--blue-soft); color: var(--blue-dark);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; border: 1px solid #bfdbfe;
}

/* ---------- Layout ---------- */
.layout { display: flex; align-items: flex-start; min-height: calc(100vh - var(--header-h)); }
.sidebar {
  position: sticky; top: var(--header-h);
  width: 250px; flex-shrink: 0;
  height: calc(100vh - var(--header-h));
  padding: 20px 14px;
  background: var(--white);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.nav-label {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); padding: 0 12px 8px;
}
.nav-btn {
  width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 11px 12px; margin-bottom: 4px;
  background: none; border: 0; border-radius: 10px;
  font-size: 15px; font-weight: 600; color: var(--text);
  text-align: left; cursor: pointer;
}
.nav-btn:hover { background: var(--bg); }
.nav-btn.active { background: var(--blue-soft); color: var(--blue-dark); }
.nav-count {
  margin-left: auto; font-size: 12px; font-weight: 700;
  background: var(--bg); color: var(--muted);
  padding: 2px 8px; border-radius: 999px;
}
.nav-btn.active .nav-count { background: #dbeafe; color: var(--blue-dark); }
.overlay { display: none; position: fixed; inset: 0; z-index: 35; background: rgba(15, 23, 42, .45); }

/* Content area: centered inside the space next to the sidebar */
main { flex: 1; min-width: 0; padding: 36px 32px 8px; }
.container { width: 100%; max-width: 1280px; margin: 0 auto; }

/* ---------- Welcome + Featured ---------- */
.welcome h1 { margin: 0 0 8px; font-size: 34px; line-height: 1.2; color: var(--navy); }
.welcome p { margin: 0; color: var(--muted); font-size: 17px; max-width: 640px; }

.featured {
  margin-top: 26px; padding: 34px 40px;
  border-radius: 18px;
  background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
  color: #fff;
  display: flex; align-items: center; justify-content: space-between; gap: 32px;
  box-shadow: var(--shadow);
}
.featured-tag {
  display: inline-block; font-size: 12px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
  background: rgba(255, 255, 255, .18); padding: 4px 10px; border-radius: 999px;
}
.featured h2 { margin: 12px 0 6px; font-size: 28px; line-height: 1.25; }
.featured p { margin: 0 0 20px; color: #dbeafe; max-width: 520px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; border-radius: 10px; border: 0;
  font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-dark); }
.btn-light { background: #fff; color: var(--blue-dark); }
.btn-light:hover { background: var(--blue-soft); }
.btn-ghost { background: var(--white); color: var(--text); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--bg); }
.btn.is-disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
.featured-art {
  width: 150px; height: 150px; flex-shrink: 0;
  border-radius: 24px; background: rgba(255, 255, 255, .12);
  display: flex; align-items: center; justify-content: center;
  font-size: 58px; font-weight: 800;
}

/* ---------- Sections ---------- */
.section { margin-top: 40px; scroll-margin-top: 84px; }
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
}
.section-head h2 { margin: 0; font-size: 22px; color: var(--navy); }
.section-head span { font-size: 14px; color: var(--muted); }

.grid { display: grid; gap: 18px; }
.cat-grid { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.tool-grid { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }

.card {
  background: var(--white); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
  min-width: 0;
}
.cat-card {
  padding: 22px; text-align: left; cursor: pointer;
  font: inherit; color: inherit;
  transition: transform .15s, border-color .15s;
}
.cat-card:hover { transform: translateY(-2px); border-color: #93c5fd; }
.cat-card.active { border-color: var(--blue); box-shadow: 0 0 0 3px #bfdbfe; }
.icon-box {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--blue-soft); color: var(--blue-dark);
  display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
}
.cat-card h3 { margin: 0 0 8px; font-size: 17px; color: var(--navy); }
.cat-card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.cat-card li {
  font-size: 12px; color: var(--muted);
  background: var(--bg); border: 1px solid var(--line);
  padding: 2px 8px; border-radius: 999px;
}
.cat-card .count { margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--blue-dark); }

.tool-card { padding: 22px; display: flex; flex-direction: column; }
.tool-card.soon { background: #fbfcfe; }
.tool-card.soon .icon-box { background: #f1f5f9; color: #94a3b8; }
.tool-card.soon h3, .tool-card.soon p { color: #7b8799; }
.tool-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--green-soft); color: var(--green); }
.badge.soon { background: var(--amber-soft); color: var(--amber); }
.tool-card h3 { margin: 0 0 4px; font-size: 17px; color: var(--navy); }
.tool-cat { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.tool-card p.desc { margin: 0 0 18px; font-size: 14px; color: var(--muted); flex: 1; }
.tool-card .btn { width: 100%; }

.empty {
  display: none; text-align: center; padding: 40px 20px;
  background: var(--white); border: 1px dashed #cbd5e1; border-radius: var(--radius);
  color: var(--muted);
}
.empty.show { display: block; }
.empty strong { display: block; color: var(--navy); font-size: 17px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }

/* ---------- Footer ---------- */
.footer { margin-top: 56px; padding: 24px 32px; border-top: 1px solid var(--line); background: var(--white); }
.footer-inner {
  max-width: 1280px; margin: 0 auto;
  display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap;
  font-size: 14px; color: var(--muted);
}
.footer strong { color: var(--navy); }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .menu-btn { display: flex; }
  .crumb { display: none; }
  .sidebar {
    position: fixed; top: 0; left: 0; z-index: 40;
    height: 100vh; padding-top: 24px;
    transform: translateX(-100%); transition: transform .25s;
  }
  .sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(15, 23, 42, .3); }
  .overlay.show { display: block; }
  main { padding: 24px 16px 8px; }
  .footer { padding: 22px 16px; }
}
@media (max-width: 640px) {
  .header { padding: 0 12px; gap: 10px; }
  .brand-text { display: none; }
  .search { margin-left: 0; }
  .welcome h1 { font-size: 27px; }
  .featured { flex-direction: column; align-items: flex-start; padding: 24px; }
  .featured-art { display: none; }
  .featured h2 { font-size: 22px; }
  .tool-grid { grid-template-columns: minmax(0, 1fr); }
  .footer-inner { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}
</style>
</head>
<body>

<header class="header">
  <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="./">
    <span class="brand-logo" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
    </span>
    <span class="brand-text">Student Tools</span>
  </a>
  <div class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="searchInput" type="search" placeholder="Search tools..." aria-label="Search tools" autocomplete="off">
  </div>
  <div class="crumb" aria-label="Breadcrumb">Student Tools / <strong id="crumbCurrent">Overview</strong></div>
  <div class="avatar" title="Student Tools" aria-hidden="true">ST</div>
</header>

<div class="overlay" id="overlay"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="nav-label">Categories</div>
    <nav id="nav"></nav>
  </aside>

  <main id="top">
    <div class="container">
      <section class="welcome">
        <h1>Learn smarter. Build better.</h1>
        <p>Everything you need to study, calculate, and explore engineering — in one place.</p>
      </section>

      <section class="featured" id="featured" aria-label="Featured tool" hidden></section>

      <section class="section" aria-labelledby="catTitle">
        <div class="section-head"><h2 id="catTitle">Explore by category</h2></div>
        <div class="grid cat-grid" id="catGrid"></div>
      </section>

      <section class="section" id="library" aria-labelledby="libTitle">
        <div class="section-head">
          <h2 id="libTitle">Tool library</h2>
          <span id="libInfo" aria-live="polite"></span>
        </div>
        <div class="grid tool-grid" id="toolGrid"></div>
        <div class="empty" id="notice" role="status"></div>
      </section>
    </div>
  </main>
</div>

<footer class="footer">
  <div class="footer-inner">
    <div><strong>Student Tools</strong> — Free tools for engineering students.</div>
    <div>Free tools · Learn by doing · © <span id="year"></span> Student Tools</div>
  </div>
</footer>

<!-- Tool list lives in its own file. Add new tools there, not here. -->
<script src="tools.js"></script>
<script>
/* ---------- Static data: categories ---------- */
var ICONS = {
  all: '<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
  electrical: '<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',
  digital: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  academic: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>',
  engineering: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/>'
};

var CATEGORIES = [
  { id: "all", name: "Overview" },
  { id: "electrical", name: "Electrical", tags: ["Circuits", "Voltage", "Current", "Resistance", "Power"] },
  { id: "digital", name: "Digital Logic", tags: ["Binary", "Decimal", "Hexadecimal", "Boolean logic", "Truth tables"] },
  { id: "academic", name: "Academic", tags: ["GPA calculator", "Grade calculations", "Study utilities"] },
  { id: "engineering", name: "Engineering", tags: ["Unit conversion", "Technical utilities", "Measurement tools"] }
];

/* ---------- Helpers ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function catName(id) {
  for (var k = 0; k < CATEGORIES.length; k++) if (CATEGORIES[k].id === id) return CATEGORIES[k].name;
  return "";
}
function icon(id, size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[id] || "") + '</svg>';
}
function isAvailable(t) {
  return t.status === "available" && typeof t.href === "string" && t.href !== "";
}

/* ---------- Load tool list (from tools.js) ---------- */
var loadFailed = !Array.isArray(window.STUDENT_TOOLS);
var TOOLS = (loadFailed ? [] : window.STUDENT_TOOLS).filter(function (t) {
  return t && t.name && catName(t.category);
});

function countIn(cat) {
  return TOOLS.filter(function (t) { return cat === "all" || t.category === cat; }).length;
}

/* ---------- State + elements ---------- */
var state = { cat: "all", query: "" };

var navEl = document.getElementById("nav");
var catGrid = document.getElementById("catGrid");
var toolGrid = document.getElementById("toolGrid");
var noticeEl = document.getElementById("notice");
var libInfo = document.getElementById("libInfo");
var crumb = document.getElementById("crumbCurrent");
var searchInput = document.getElementById("searchInput");
var featuredEl = document.getElementById("featured");

/* ---------- Rendering ---------- */
function renderFeatured() {
  var t = TOOLS.filter(function (x) { return x.featured && isAvailable(x); })[0];
  if (!t) { featuredEl.hidden = true; return; }
  var f = t.featured;
  featuredEl.innerHTML =
    '<div><span class="featured-tag">Featured tool</span>' +
    '<h2>' + esc(f.headline || t.name) + '</h2>' +
    '<p>' + esc(f.text || t.description) + '</p>' +
    '<a class="btn btn-light" href="' + esc(t.href) + '">Open ' + esc(t.name) + ' →</a></div>' +
    '<div class="featured-art" aria-hidden="true">' + esc(f.symbol || "★") + '</div>';
  featuredEl.hidden = false;
}

function renderNav() {
  navEl.innerHTML = CATEGORIES.map(function (c) {
    var active = state.cat === c.id;
    return '<button class="nav-btn' + (active ? ' active' : '') + '" data-cat="' + c.id + '"' +
      (active ? ' aria-current="page"' : '') + '>' + icon(c.id, 20) +
      '<span>' + c.name + '</span><span class="nav-count">' + countIn(c.id) + '</span></button>';
  }).join("");
}

function renderCategories() {
  catGrid.innerHTML = CATEGORIES.filter(function (c) { return c.id !== "all"; }).map(function (c) {
    var n = countIn(c.id);
    return '<button class="card cat-card' + (state.cat === c.id ? ' active' : '') + '" data-cat="' + c.id + '">' +
      '<div class="icon-box">' + icon(c.id, 24) + '</div>' +
      '<h3>' + c.name + '</h3>' +
      '<ul>' + c.tags.map(function (t) { return '<li>' + t + '</li>'; }).join("") + '</ul>' +
      '<div class="count">' + n + (n === 1 ? ' tool' : ' tools') + ' →</div></button>';
  }).join("");
}

function matches(t) {
  if (state.cat !== "all" && t.category !== state.cat) return false;
  var q = state.query.trim().toLowerCase();
  if (!q) return true;
  var hay = (t.name + " " + catName(t.category) + " " + (t.description || "") + " " + (t.keywords || "")).toLowerCase();
  return q.split(/\s+/).every(function (w) { return hay.indexOf(w) !== -1; });
}

function showNotice(html) { noticeEl.innerHTML = html; noticeEl.classList.add("show"); }
function hideNotice() { noticeEl.innerHTML = ""; noticeEl.classList.remove("show"); }

function renderTools() {
  if (loadFailed) {
    toolGrid.innerHTML = "";
    libInfo.textContent = "";
    showNotice("<strong>Tool list unavailable</strong>The file tools.js could not be loaded. Make sure it is in the same folder as index.html.");
    return;
  }

  var list = TOOLS.filter(matches);
  toolGrid.innerHTML = list.map(function (t) {
    var ok = isAvailable(t);
    var badge = ok ? '<span class="badge ok">Available</span>' : '<span class="badge soon">Coming Soon</span>';
    var btn = ok
      ? '<a class="btn btn-primary" href="' + esc(t.href) + '">Open tool</a>'
      : '<button class="btn is-disabled" disabled aria-disabled="true">Not available yet</button>';
    return '<article class="card tool-card' + (ok ? '' : ' soon') + '">' +
      '<div class="tool-top"><div class="icon-box">' + icon(t.category, 24) + '</div>' + badge + '</div>' +
      '<h3>' + esc(t.name) + '</h3>' +
      '<p class="tool-cat">' + catName(t.category) + '</p>' +
      '<p class="desc">' + esc(t.description) + '</p>' + btn + '</article>';
  }).join("");

  if (list.length === 0) {
    showNotice('<strong>No tools found</strong>Try a different keyword or choose another category.' +
      '<div><button class="btn btn-ghost" data-clear>Clear filters</button></div>');
  } else {
    hideNotice();
  }
  toolGrid.style.display = list.length ? "" : "none";
  libInfo.textContent = list.length + (list.length === 1 ? " tool" : " tools") +
    (state.cat !== "all" ? " in " + catName(state.cat) : "");
}

function render() {
  renderFeatured();
  renderNav();
  renderCategories();
  renderTools();
  crumb.textContent = catName(state.cat);
}

function setCategory(cat, scroll) {
  state.cat = cat;
  render();
  closeMenu();
  if (scroll && cat !== "all") {
    document.getElementById("library").scrollIntoView();
  } else if (scroll) {
    window.scrollTo(0, 0);
  }
}

/* ---------- Events ---------- */
document.addEventListener("click", function (e) {
  var catBtn = e.target.closest("[data-cat]");
  if (catBtn) { setCategory(catBtn.getAttribute("data-cat"), true); return; }
  if (e.target.closest("[data-clear]")) {
    state.cat = "all";
    state.query = "";
    searchInput.value = "";
    render();
  }
});

searchInput.addEventListener("input", function () {
  state.query = searchInput.value;
  renderTools();
});

/* Mobile menu */
var sidebar = document.getElementById("sidebar");
var overlay = document.getElementById("overlay");
var menuBtn = document.getElementById("menuBtn");
function openMenu() {
  sidebar.classList.add("open");
  overlay.classList.add("show");
  menuBtn.setAttribute("aria-expanded", "true");
}
function closeMenu() {
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
  menuBtn.setAttribute("aria-expanded", "false");
}
menuBtn.addEventListener("click", function () {
  sidebar.classList.contains("open") ? closeMenu() : openMenu();
});
overlay.addEventListener("click", closeMenu);
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape") closeMenu();
});

/* ---------- Init ---------- */
document.getElementById("year").textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
