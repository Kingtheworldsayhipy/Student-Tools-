<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Student Tools</title>
  <desc id="d">Animated banner: Student Tools, one tab instead of twenty. Free calculators and converters for engineering students.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#10234f"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93c5fd" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="22"/></clipPath>
  </defs>
  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .float { animation: float 7s ease-in-out infinite; }
    .f2 { animation-duration: 9s; animation-delay: -2s; }
    .f3 { animation-duration: 8s; animation-delay: -4s; }
    .f4 { animation-duration: 10s; animation-delay: -1s; }
    .f5 { animation-duration: 6.5s; animation-delay: -3s; }
    .f6 { animation-duration: 9.5s; animation-delay: -5s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    .rise { opacity: 0; animation: rise 1s ease-out forwards; }
    .r1 { animation-delay: .2s; } .r2 { animation-delay: .6s; } .r3 { animation-delay: 1s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateX(-700px); } to { transform: translateX(1300px); } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .float, .scan, .blink, .rise { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect class="scan" x="0" y="0" width="420" height="3" fill="url(#glow)"/>

    <!-- floating tool symbols -->
    <g class="mono" fill="#bfdbfe" font-weight="700">
      <g class="float" opacity="0.55"><text x="930" y="86" font-size="46">Ω</text></g>
      <g class="float f2" opacity="0.45"><text x="1040" y="150" font-size="30">0xFF</text></g>
      <g class="float f3" opacity="0.5"><text x="905" y="214" font-size="34">A ∧ B</text></g>
      <g class="float f4" opacity="0.45"><text x="1060" y="256" font-size="34">⇄</text></g>
      <g class="float f5" opacity="0.5"><text x="1105" y="70" font-size="30">kW</text></g>
      <g class="float f6" opacity="0.4"><text x="800" y="284" font-size="28">GPA 3.8</text></g>
      <g class="float f3" opacity="0.4"><text x="760" y="60" font-size="26">psi → kPa</text></g>
    </g>

    <!-- text -->
    <g class="sans">
      <g class="rise r1">
        <rect x="64" y="64" width="54" height="54" rx="14" fill="#2563eb"/>
        <path d="M95 74 80 96h11l-2 18 17-24H94z" fill="#fff"/>
        <text x="136" y="104" font-size="52" font-weight="800" fill="#ffffff">Student Tools</text>
      </g>
      <text class="rise r2" x="64" y="172" font-size="30" font-weight="700" fill="#dbeafe">One tab instead of twenty.</text>
      <text class="rise r3" x="64" y="214" font-size="20" fill="#bfdbfe">Free calculators and converters for engineering students.</text>
    </g>
    <g class="mono rise r3">
      <text x="64" y="268" font-size="18" fill="#93c5fd">no sign-up · no ads · no frameworks</text>
      <rect class="blink" x="452" y="252" width="10" height="20" fill="#93c5fd"/>
    </g>
  </g>
</svg>
